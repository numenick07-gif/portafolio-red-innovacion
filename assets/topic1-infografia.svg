<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1460" viewBox="0 0 1100 1460" role="img" aria-labelledby="title desc"><title id="title">Laboratorio de innovación educativa</title><desc id="desc">Infografía del tópico 1: problema, investigación y propuesta teórica, sin plataforma digital.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1c2360"/><stop offset="1" stop-color="#6554e8"/></linearGradient><linearGradient id="cyan" x2="1"><stop stop-color="#27cbd4"/><stop offset="1" stop-color="#77e5d5"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#0d1640" flood-opacity=".13"/></filter></defs><rect width="1100" height="1460" rx="40" fill="#f6f7fd"/><rect width="1100" height="370" rx="40" fill="url(#bg)"/><circle cx="1000" cy="45" r="190" fill="#fff" opacity=".06"/><circle cx="60" cy="300" r="140" fill="#3bd9dc" opacity=".12"/><text x="66" y="95" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5" fill="#87f1e5">TÓPICO 01 · INVESTIGACIÓN EDUCATIVA</text><text x="66" y="177" font-family="Arial,sans-serif" font-size="56" font-weight="800" fill="#fff">LABORATORIO DE</text><text x="66" y="243" font-family="Arial,sans-serif" font-size="66" font-weight="800" fill="#fff">INNOVACIÓN</text><text x="66" y="302" font-family="Arial,sans-serif" font-size="28" fill="#e5e7ff">Del problema del aula a una solución teórica</text><g font-family="Arial,sans-serif"><rect x="55" y="415" width="990" height="190" rx="27" fill="#fff" filter="url(#sh)"/><rect x="55" y="415" width="18" height="190" rx="9" fill="#f69b4a"/><circle cx="135" cy="484" r="34" fill="#fff0df"/><text x="135" y="496" text-anchor="middle" font-size="34" font-weight="800" fill="#d66a16">1</text><text x="194" y="476" font-size="30" font-weight="800" fill="#18213c">EL DESAFÍO EDUCATIVO</text><text x="194" y="517" font-size="22" fill="#52627e">Distintos ritmos de aprendizaje en 5.º grado</text><text x="194" y="552" font-size="22" fill="#52627e">al estudiar números naturales y adición.</text><path d="M550 615v36" stroke="#8172ef" stroke-width="8" stroke-linecap="round"/><path d="m532 640 18 20 18-20" fill="none" stroke="#8172ef" stroke-width="8" stroke-linecap="round"/><rect x="55" y="670" width="990" height="190" rx="27" fill="#fff" filter="url(#sh)"/><rect x="55" y="670" width="18" height="190" rx="9" fill="#28bfbe"/><circle cx="135" cy="740" r="34" fill="#d9fbf7"/><text x="135" y="751" text-anchor="middle" font-size="34" font-weight="800" fill="#138c8c">2</text><text x="194" y="730" font-size="30" font-weight="800" fill="#18213c">LA INVESTIGACIÓN</text><text x="194" y="772" font-size="22" fill="#52627e">Atención a la diversidad, mediación docente,</text><text x="194" y="806" font-size="22" fill="#52627e">TIC y evaluación formativa.</text><path d="M550 870v36" stroke="#8172ef" stroke-width="8" stroke-linecap="round"/><path d="m532 895 18 20 18-20" fill="none" stroke="#8172ef" stroke-width="8" stroke-linecap="round"/><rect x="55" y="925" width="990" height="210" rx="27" fill="#fff" filter="url(#sh)"/><rect x="55" y="925" width="18" height="210" rx="9" fill="#8c70e9"/><circle cx="135" cy="1005" r="34" fill="#eee7ff"/><text x="135" y="1017" text-anchor="middle" font-size="34" font-weight="800" fill="#6a51d4">3</text><text x="194" y="993" font-size="30" font-weight="800" fill="#18213c">LA PROPUESTA CONCEPTUAL</text><text x="194" y="1035" font-size="22" fill="#52627e">Actividades flexibles, apoyos diferenciados</text><text x="194" y="1069" font-size="22" fill="#52627e">y recursos digitales como mediación pedagógica.</text><rect x="55" y="1195" width="990" height="145" rx="25" fill="#e9e6ff"/><text x="90" y="1250" font-size="27" font-weight="800" fill="#4938b6">RESULTADO DEL TÓPICO 1</text><text x="90" y="1291" font-size="22" fill="#343d69">Fundamentación teórica de una solución innovadora.</text><text x="90" y="1320" font-size="18" fill="#665c9c">El desarrollo de la plataforma corresponde al Tópico 3.</text><text x="550" y="1410" text-anchor="middle" font-size="21" font-weight="700" fill="#777e9b">RED DE INNOVACIÓN · PORTAFOLIO ACADÉMICO</text></g></svg>